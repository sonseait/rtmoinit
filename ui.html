<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080808;--surface:#101010;--border:#3c3025;--accent:#ff922b;--text:#e7d6c3;--muted:#ad9b89;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
*{box-sizing:border-box}body{margin:0}::selection{background:var(--accent);color:var(--bg)}
header,main{max-width:1440px;margin:auto;padding:14px 16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--accent)}
h1{font-size:15px;line-height:1.4;margin:0;overflow-wrap:anywhere}h1::before{content:">_ ";color:var(--accent)}h2{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;overflow-wrap:anywhere;color:var(--muted)}h2::before{content:"# ";color:var(--accent)}
nav:empty{display:none}nav{display:flex;gap:6px;flex-wrap:wrap;min-width:0}button{font:inherit;font-size:11px;min-height:32px;max-width:100%;overflow-wrap:anywhere;background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:0;cursor:pointer;transition:background-color 120ms,border-color 120ms,color 120ms}button:hover{border-color:var(--accent);color:var(--accent)}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}button:active{background:#ffc078;color:var(--bg)}button:focus-visible,.scroll:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#connection,#checkpoint{font-size:11px;color:var(--muted)}#connection::before{content:"[ ";color:var(--accent)}#connection::after{content:" ]";color:var(--accent)}#checkpoint{padding:8px 16px 0;max-width:1440px;margin:auto;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}.panel{grid-column:span var(--width);background:var(--surface);border:1px solid var(--border);border-radius:0;padding:12px;min-width:0}
.stat{font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}.unit{font-size:11px;color:var(--muted);margin-left:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-top:6px;overflow-wrap:anywhere}.swatch{display:inline-block;width:7px;height:7px;margin-right:5px}.chart{display:block;width:100%;height:180px}.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.scroll{overflow:auto;max-height:260px;scrollbar-color:var(--border) var(--surface)}table{border-collapse:collapse;width:100%;font-size:11px;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);overflow-wrap:anywhere;max-width:400px}th{position:sticky;top:0;background:var(--surface);color:var(--accent);font-weight:500}tbody tr:hover{background:#1b1610}
.empty{color:var(--muted);font-size:11px}#error{color:#ffb38a;max-width:1440px;margin:0 auto;padding:0 16px;overflow-wrap:anywhere}footer{max-width:1440px;margin:auto;padding:0 16px 16px;color:var(--muted);font-size:10px}
@media(max-width:700px){.panel{grid-column:span 12}header,main{padding:12px}#checkpoint{padding:8px 12px 0}#error{padding:0 12px}footer{padding:0 12px 12px}}
@media(pointer:coarse){button{min-height:40px;min-width:40px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header><h1 id="title">Realtime dashboard</h1><nav aria-label="Dashboards" id="nav"></nav><span id="connection" role="status">Connecting…</span></header>
<p id="checkpoint" role="status"></p><p id="error" role="alert"></p><main id="panels" class="grid" aria-label="Dashboard panels"></main><footer>History samples reflect the last value in each interval. Gaps indicate missing samples.</footer>
<script>
'use strict';
const base=location.pathname.replace(/\/$/,'');
const colors=['#ff922b','#ffd8a8','#e8b86d','#f8f0e3','#c99c80','#a6a6a6'];
const number=new Intl.NumberFormat(undefined,{maximumFractionDigits:3});
const stamp=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});
let definition,active,latest,source;
const byID=id=>document.getElementById(id);
function element(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
function svg(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==undefined)e.textContent=text;return e;}
function chart(panel,snapshot,width){
 const plotWidth=Math.max(1,width-70);
 const root=svg('svg',{viewBox:'0 0 '+width+' 180',class:'chart',role:'img','aria-label':(panel.title||panel.id)+' time series'});
 const entries=panel.series.map(id=>({id,def:definition.series.find(s=>s.id===id),data:snapshot.series[id]}));
 const points=entries.flatMap(s=>s.data.history);
 if(!points.length)return element('p','Waiting for samples…','empty');
 const loT=Math.min(...entries.filter(s=>s.data.history.length).map(s=>s.data.history[0][0]));
 const hiT=Math.max(loT+1000,snapshot.time);
 let lo=0,hi=0;for(const p of points){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);}if(hi===lo)hi=lo+1;
 const scale=Math.max(Math.abs(lo),Math.abs(hi)),low=lo/scale,high=hi/scale;
 const x=t=>55+(t-loT)/(hiT-loT)*plotWidth,y=v=>145-(v/scale-low)/(high-low)*125;
 for(let i=0;i<4;i++){const v=(low+(high-low)*i/3)*scale,py=y(v);root.append(svg('line',{x1:55,x2:width-15,y1:py,y2:py,stroke:'var(--border)'}),svg('text',{x:48,y:py+4,'text-anchor':'end'},number.format(v)));}
 root.append(svg('text',{x:55,y:170},stamp.format(loT)),svg('text',{x:width-15,y:170,'text-anchor':'end'},stamp.format(hiT)));
 entries.forEach((s,index)=>{
  const color=colors[index%colors.length],history=s.data.history;
  const step=definition.sampleIntervalMs;
  if(panel.type==='bar'){
   // ponytail: render at most 120 bars per series; add server-side aggregation for denser charts.
   const stride=Math.max(1,Math.ceil(history.length/120));
   const width=Math.max(.5,Math.min(20,plotWidth/Math.min(120,history.length)/entries.length));
   for(let i=0;i<history.length;i+=stride){const p=history[i],top=Math.min(y(p[1]),y(0));const r=svg('rect',{x:x(p[0])+index*width,y:top,width,height:Math.max(1,Math.abs(y(p[1])-y(0))),fill:color});r.append(svg('title',{},stamp.format(p[0])+': '+number.format(p[1])));root.append(r);}
  }else{
   let path='';history.forEach((p,i)=>{path+=(i===0||p[0]-history[i-1][0]>step*1.5?'M':'L')+x(p[0]).toFixed(2)+','+y(p[1]).toFixed(2);});
   root.append(svg('path',{d:path,fill:'none',stroke:color,'stroke-width':2}));
   if(history.length===1)root.append(svg('circle',{cx:x(history[0][0]),cy:y(history[0][1]),r:3,fill:color}));
  }
 });
 const box=element('div');box.append(root);const legend=element('div',undefined,'legend');
 entries.forEach((s,i)=>{const label=element('span'),swatch=element('span',undefined,'swatch');swatch.style.background=colors[i%colors.length];label.append(swatch,document.createTextNode((s.def.title||s.id)+(s.def.unit?' ('+s.def.unit+')':'')));legend.append(label);});box.append(legend);return box;
}
function render(){
 if(!latest||!active)return;
 const panels=byID('panels');panels.replaceChildren();
 for(const p of active.panels){
  const card=element('section',undefined,'panel');card.style.setProperty('--width',p.width);card.append(element('h2',p.title||p.id));panels.append(card);
  if(p.type==='stat'){
   const id=p.series[0],value=latest.series[id].value,def=definition.series.find(s=>s.id===id),stat=element('div',value===null?'—':number.format(value),'stat');stat.append(element('span',def.unit||'','unit'));card.append(stat);
  }else if(p.type==='table'){
   const def=definition.tables.find(t=>t.id===p.table),rows=latest.tables[p.table],wrap=element('div',undefined,'scroll'),table=element('table');table.setAttribute('aria-label',p.title||p.id);
   const head=element('thead'),tr=element('tr');for(const c of def.columns){const th=element('th',c.label||c.key);th.scope='col';tr.append(th);}head.append(tr);table.append(head);
   const body=element('tbody');for(const row of rows){const tr=element('tr');for(const c of def.columns){const v=row[c.key];tr.append(element('td',v==null?'—':typeof v==='number'?number.format(v):String(v)));}body.append(tr);}table.append(body);wrap.append(table);card.append(wrap);if(!rows.length)card.append(element('p','No rows','empty'));
  }else{const style=getComputedStyle(card);card.append(chart(p,latest,card.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)));}
 }
 const status=latest.status;
 byID('checkpoint').textContent=!status.persistence?'Storage: RAM only':status.lastError?'Checkpoint failed: '+status.lastError:'Redis checkpoint: '+(status.lastSuccess?new Date(status.lastSuccess).toLocaleString():'waiting for first checkpoint');
}
async function start(){
 const response=await fetch(base+'/definition',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw new Error('Cannot load definition (HTTP '+response.status+')');definition=await response.json();
 active=definition.dashboards[0];
 if(definition.dashboards.length>1)for(const dashboard of definition.dashboards){const button=element('button',dashboard.title||dashboard.id);button.type='button';button.setAttribute('aria-pressed',dashboard===active);button.addEventListener('click',()=>{active=dashboard;for(const b of byID('nav').children)b.setAttribute('aria-pressed',b===button);byID('title').textContent=dashboard.title||dashboard.id;render();});byID('nav').append(button);}
 byID('title').textContent=active.title||active.id;
 source=new EventSource(base+'/events');source.onopen=()=>{byID('connection').textContent='Live';byID('error').textContent='';};source.onerror=()=>{byID('connection').textContent='Disconnected · retrying…';};source.addEventListener('snapshot',event=>{try{latest=JSON.parse(event.data);render();}catch(error){byID('error').textContent=error.message;}});
 source.addEventListener('update',event=>{try{
  const update=JSON.parse(event.data);if(!latest)return;
  for(const [id,data]of Object.entries(update.series)){
   const old=latest.series[id].history,first=data.history[0]?.[0]??Infinity;
   data.history=old.filter(p=>p[0]<first&&p[0]>update.time-definition.historyMs).concat(data.history);
  }
  latest=update;render();
 }catch(error){byID('error').textContent=error.message;}});
}
window.addEventListener('resize',render);
window.addEventListener('pagehide',()=>source?.close());
start().catch(error=>{byID('connection').textContent='Unavailable';byID('error').textContent=error.message;});
</script>
</body>
</html>
